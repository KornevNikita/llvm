    #     echo LD_LIBRARY_PATH=$PWD/toolchain/lib/:$LD_LIBRARY_PATH >> $GITHUB_ENV
    - name: Set up yarpgen
      run: |
        git clone https://github.com/intel/yarpgen.git
        cmake -B yarpgen/build -G Ninja yarpgen/
        ninja -C yarpgen/build
    - name: Run yarpgen
      run: cd yarpgen; python3 scripts/run_gen.py --target clang
    - name: Pack results
      run: tar -czf yarpgen_results.tar.gz yarpgen/testing
    - uses: actions/upload-artifacts
      input: yarpgen_results.tar.gz
      uses: actions/upload-artifact@v5
      with:
        name: yarpgen_results
        path: yarpgen_results.tar.gz
        retention-days: 7
    - name: Clean up
      run: rm -rf toolchain yarpgen
